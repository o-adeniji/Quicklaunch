name: QuickLaunch CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Test and Build Website
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x tests/smoke-test.sh scripts/build.sh

      - name: Run automated smoke test
        run: ./tests/smoke-test.sh

      - name: Build versioned artifact
        run: ./scripts/build.sh "${{ github.sha }}"

      - name: Store build artifact
        uses: actions/upload-artifact@v4
        with:
          name: quicklaunch-${{ github.sha }}
          path: dist/*.tar.gz
          retention-days: 7
